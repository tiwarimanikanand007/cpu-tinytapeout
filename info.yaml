# Tiny Tapeout project information
project:
  title:        "8-bit CPU"      # Project title
  author:       "Manikanand Tiwari"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit CPU with external RAM/ROM/GPU, interfaced through a time-multiplexed address/data bus"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     10000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_tiwarimanikanand007_cpu"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "cpu_fixed.v"
    - "tt_um_cpu_wrapper.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "BUTTONPRESSED"
  ui[1]: ""
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  # Outputs
  uo[0]: "ALE - address latch enable strobe"
  uo[1]: "RAM2BUS"
  uo[2]: "ROM2BUS"
  uo[3]: "GPU2BUS"
  uo[4]: "SVRAM"
  uo[5]: "SVGPU"
  uo[6]: "BUTTON2BUS"
  uo[7]: "BUTTONRST"

  # Bidirectional pins
  uio[0]: "AD0 - shared address/data bus (multiplexed)"
  uio[1]: "AD1 - shared address/data bus (multiplexed)"
  uio[2]: "AD2 - shared address/data bus (multiplexed)"
  uio[3]: "AD3 - shared address/data bus (multiplexed)"
  uio[4]: "AD4 - shared address/data bus (multiplexed)"
  uio[5]: "AD5 - shared address/data bus (multiplexed)"
  uio[6]: "AD6 - shared address/data bus (multiplexed)"
  uio[7]: "AD7 - shared address/data bus (multiplexed)"

# Do not change!
yaml_version: 6
